<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RJ Resin Art and Craft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero" style="background-image: url('cover.png');">
    <div class="hero-overlay">
      <img src="profile.jpeg" alt="RJ Resin Art and Craft" class="profile">
      <h1>RJ Resin Art and Craft</h1>
      <p>Handmade resin art: jewellery, frames, clocks and preservation</p>
    </div>
  </header>

  <nav id="categories" class="categories"></nav>

  <main id="products" class="products"></main>

  <div id="order-modal" class="modal hidden">
    <div class="modal-box">
      <button id="close-modal" class="close">&times;</button>
      <h2>Order / Interest</h2>
      <p id="selected-item"></p>
      <input type="text" id="cust-name" placeholder="My name">
      <input type="tel" id="cust-phone" placeholder="My phone number">
      <textarea id="cust-note" placeholder="What do you want? (write size, colour, name etc.)"></textarea>
      <button id="send-order" class="btn">send in-WhatsApp</button>
    </div>
  </div>

  <footer>
    <p>For more details contact us!</p>
    <p>Call/WhatsApp: 8910425745</p>
    <p>Email: rjresinartcraft@gmail.com</p>
    <p>&copy; RJ Resin Art and Craft</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
